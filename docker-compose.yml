version: "3.8"

services:
  frontend:
    image: itdocjaina/prod:1.8.2
    container_name: crmcore-frontend
    restart: always

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

      LOKI_URL: "http://192.168.47.24:3100/loki/api"
      DOC_USERNAME: "Ranjan"
      DOC_PASSWORD: "Ranjan@123"
      DOC_ACCESSCODE: "karbonnlive"
      DOC_BASE_URL: "https://documents.jainaindia.com/api"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
